<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hukukİçtihat+ Ceza V4</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;background:#f4f7fb;color:#172033}
.w{max-width:980px;margin:auto;padding:12px}
.h{background:#173b79;color:#fff;padding:18px;border-radius:16px}
h1{margin:0 0 4px;font-size:27px}
.sub{opacity:.9}
.g{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
input,select,button{font:inherit;padding:12px;border-radius:10px}
input,select{border:1px solid #ccd5e2;background:#fff}
button{border:0;background:#2457a7;color:#fff;font-weight:700}
.s{margin:14px 2px;color:#667085}
.c{background:#fff;border:1px solid #d9e1ec;border-radius:14px;padding:15px;margin:12px 0}
.m{font-size:13px;color:#596579;margin:7px 0}
.t{white-space:pre-wrap;line-height:1.55}
.more{margin-top:10px;background:#eef3fb;color:#173b79}
@media(max-width:650px){.g,.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <div class="h">
    <h1>Hukukİçtihat+ Ceza V4</h1>
    <div class="sub">50.000 karar • hızlı ters indeks • tamamen yerel</div>
    <div class="g">
      <input id="q" placeholder="olası kast, uyuşturucu, HTS, 2019/3931...">
      <button id="searchBtn">ARA</button>
    </div>
    <div class="f">
      <input id="court" placeholder="Daire: 1. Ceza">
      <input id="year" placeholder="Karar yılı">
      <select id="sort">
        <option value="rel">İlgililik</option>
        <option value="date">En yeni tarih</option>
      </select>
    </div>
  </div>
  <div id="st" class="s">İndeks yükleniyor...</div>
  <div id="res"></div>
</div>
<script src="app.js"></script>
</body>
</html>
