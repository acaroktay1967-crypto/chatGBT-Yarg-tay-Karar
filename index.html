<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Hukukİçtihat+ Ceza V4.2</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --primary: #4a90d9;
            --primary-dark: #3a7bc8;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #f8f9fa;
            --text: #e8e8e8;
            --text-muted: #a0a0a0;
            --border: #2a2a4a;
            --card-bg: #1e1e3f;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
        }
        
        header {
            background: var(--darker);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 20px;
        }
        
        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 4px;
        }
        
        header .version {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .search-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        .search-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .search-input-wrapper {
            display: flex;
            gap: 8px;
        }
        
        .search-input-wrapper input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--darker);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .search-input-wrapper input:focus {
            border-color: var(--primary);
        }
        
        .search-input-wrapper input::placeholder {
            color: var(--text-muted);
        }
        
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .filter-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .filter-group select,
        .filter-group input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--darker);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        
        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-secondary {
            background: var(--secondary);
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-export {
            background: var(--warning);
            color: var(--dark);
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .results-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .results-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .result-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            transition: border-color 0.2s;
        }
        
        .result-item:hover {
            border-color: var(--primary);
        }
        
        .result-item.saved {
            border-left: 4px solid var(--success);
        }
        
        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }
        
        .result-meta .daire {
            background: var(--primary);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .result-meta .tarih {
            color: var(--text-muted);
        }
        
        .result-meta .saved-date {
            color: var(--success);
            font-size: 0.8rem;
        }
        
        .result-esas {
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        .result-esas strong {
            color: var(--text-muted);
        }
        
        .result-ozet {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .result-actions .btn {
            padding: 8px 14px;
            font-size: 0.85rem;
        }
        
        .no-results,
        .loading,
        .info,
        .error {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        
        .error {
            color: var(--danger);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .modal-content {
            background: var(--card-bg);
            margin: 20px auto;
            max-width: 800px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--darker);
            border-bottom: 1px solid var(--border);
        }
        
        .modal-header h2 {
            font-size: 1.1rem;
            color: var(--primary);
        }
        
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 8px;
        }
        
        .modal-close:hover {
            color: var(--text);
        }
        
        .modal-body {
            padding: 20px;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .decision-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .decision-header h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        
        .decision-header p {
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        
        .decision-body pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            font-size: 0.9rem;
            line-height: 1.7;
            color: var(--text);
        }
        
        #decisionLoading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .notification {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 2000;
            animation: slideUp 0.3s ease;
        }
        
        .notification.success {
            background: var(--success);
            color: white;
        }
        
        .notification.error {
            background: var(--danger);
            color: white;
        }
        
        .notification.warning {
            background: var(--warning);
            color: var(--dark);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 40px;
            border-top: 1px solid var(--border);
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 12px;
            }
            
            header h1 {
                font-size: 1.2rem;
            }
            
            .search-section {
                padding: 14px;
            }
            
            .filters {
                grid-template-columns: 1fr 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Hukukİçtihat+ Ceza</h1>
        <span class="version">V4.2 • 50.000 Yargıtay Kararı</span>
    </header>
    
    <div class="container">
        <section class="search-section">
            <form id="searchForm" class="search-form">
                <div class="search-input-wrapper">
                    <input 
                        type="text" 
                        id="searchQuery" 
                        placeholder="Arama yapın... (örn: hırsızlık, kasten yaralama)"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >
                    <button type="submit" class="btn btn-primary">Ara</button>
                </div>
                
                <div class="filters">
                    <div class="filter-group">
                        <label for="daireFilter">Daire</label>
                        <select id="daireFilter">
                            <option value="tumu">Tüm Daireler</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="yilBaslangic">Yıl (Başlangıç)</label>
                        <input type="number" id="yilBaslangic" placeholder="2020" min="1990" max="2026">
                    </div>
                    
                    <div class="filter-group">
                        <label for="yilBitis">Yıl (Bitiş)</label>
                        <input type="number" id="yilBitis" placeholder="2026" min="1990" max="2026">
                    </div>
                    
                    <div class="filter-group">
                        <label for="siralama">Sıralama</label>
                        <select id="siralama">
                            <option value="ilgililik">İlgililik</option>
                            <option value="tarih">En Yeni</option>
                        </select>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button type="button" id="showSavedBtn" class="btn btn-success">
                        📁 Kaydedilenler
                    </button>
                    <button type="button" id="exportBtn" class="btn btn-export">
                        📤 JSON Dışa Aktar
                    </button>
                </div>
            </form>
        </section>
        
        <section id="results">
            <p class="info">Yargıtay ceza kararlarını aramak için yukarıdaki arama kutusunu kullanın.</p>
        </section>
    </div>
    
    <div id="decisionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Karar Detayı</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="decisionLoading">Yükleniyor...</div>
                <div id="decisionContent"></div>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <footer>
        <p>Hukukİçtihat+ Ceza V4.2 • iPhone &amp; a-Shell mini</p>
        <p>Yargıtay Ceza Daireleri Kararları (2020-2026)</p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
